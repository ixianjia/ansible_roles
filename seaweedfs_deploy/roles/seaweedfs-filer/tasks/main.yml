---
- name: 配置 S3 认证配置
  template:
    src: s3.json.j2
    dest: "{{ s3_config_path }}"
    owner: "{{ seaweedfs_user }}"
    group: "{{ seaweedfs_group }}"
    mode: 0600
  become: yes
  notify: restart seaweedfs-filer

- name: 配置 Filer systemd service
  template:
    src: seaweedfs-filer.service.j2
    dest: /etc/systemd/system/seaweedfs-filer.service
    owner: root
    group: root
    mode: 0644
  become: yes
  notify: restart seaweedfs-filer

- name: 启动并启用 Filer 服务
  systemd:
    name: seaweedfs-filer
    state: started
    enabled: yes
    daemon_reload: yes
  become: yes
