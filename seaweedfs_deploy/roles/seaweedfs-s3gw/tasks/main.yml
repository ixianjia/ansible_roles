---
- name: 配置 S3 Gateway systemd service
  template:
    src: seaweedfs-s3gw.service.j2
    dest: /etc/systemd/system/seaweedfs-s3gw.service
    owner: root
    group: root
    mode: 0644
  become: yes
  notify: restart seaweedfs-s3gw

- name: 启动并启用 S3 Gateway 服务
  systemd:
    name: seaweedfs-s3gw
    state: started
    enabled: yes
    daemon_reload: yes
  become: yes
