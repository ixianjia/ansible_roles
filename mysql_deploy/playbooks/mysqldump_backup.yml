---
- name: 配置 MySQL mysqldump 逻辑备份
  hosts: mysql_backup
  become: yes
  vars:
    mysqlBaseDir: "/usr/local/mysql"
    mysqlRootPassword: "{{ lookup('env', 'MYSQL_ROOT_PASSWORD') | default('secure_root_password') }}"
    backupDir: "/backup/mysql"
    backupRetentionDays: 7
    backupCompression: true
    backupEmail: "admin@example.com"

  tasks:
    - name: 创建备份目录
      file:
        path: "{{ backupDir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 创建备份用户
      mysql_user:
        name: "backup_user"
        password: "backup_password"
        priv: "SELECT, LOCK TABLES, SHOW VIEW, EVENT, TRIGGER ON *.*"
        host: localhost
        login_user: root
        login_password: "{{ mysqlRootPassword }}"
        login_unix_socket: "{{ mysqlRunDir | default('/var/run/mysqld') }}/mysqld.sock"

    - name: 安装备份依赖
      package:
        name:
          - gzip
          - mailutils
        state: present

    - name: 生成 mysqldump 备份脚本
      template:
        src: roles/mysql_deploy/templates/mysqldump_backup.sh.j2
        dest: "/usr/local/bin/mysqldump_backup.sh"
        owner: root
        group: root
        mode: '0755'

    - name: 添加 mysqldump 备份定时任务（每天 2:00）
      cron:
        name: "MySQL mysqldump backup"
        job: "/usr/local/bin/mysqldump_backup.sh"
        minute: "0"
        hour: "2"
        user: root
        cron_file: mysql_mysqldump_backup

    - name: 生成备份清理脚本
      template:
        src: roles/mysql_deploy/templates/cleanup_backups.sh.j2
        dest: "/usr/local/bin/cleanup_backups.sh"
        owner: root
        group: root
        mode: '0755'

    - name: 添加清理定时任务（每天 3:30）
      cron:
        name: "MySQL backup cleanup"
        job: "/usr/local/bin/cleanup_backups.sh"
        minute: "30"
        hour: "3"
        user: root
        cron_file: mysql_backup_cleanup

    - name: 测试备份脚本
      command: "/usr/local/bin/mysqldump_backup.sh"
      register: backupTest
      changed_when: false
      ignore_errors: yes

    - name: 输出备份测试结果
      debug:
        msg: "备份测试结果: {{ backupTest.stdout | default('执行失败，请检查日志') }}"

  handlers:
    - name: restart cron
      service:
        name: cron
        state: restarted
