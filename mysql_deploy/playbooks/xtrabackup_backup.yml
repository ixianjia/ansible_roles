---
- name: 配置 MySQL XtraBackup 物理备份
  hosts: mysql_backup
  become: yes
  vars:
    mysqlBaseDir: "/usr/local/mysql"
    mysqlRootPassword: "{{ lookup('env', 'MYSQL_ROOT_PASSWORD') | default('secure_root_password') }}"
    backupDir: "/backup/mysql"
    backupRetentionDays: 7
    backupType: "full"
    backupCompression: true
    backupParallel: 4
    backupEmail: "admin@example.com"

  tasks:
    - name: 创建备份目录
      file:
        path: "{{ backupDir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 创建 XtraBackup 备份用户
      mysql_user:
        name: "backup_user"
        password: "backup_password"
        priv: "RELOAD, LOCK TABLES, REPLICATION CLIENT, EVENT, TRIGGER ON *.*"
        host: localhost
        login_user: root
        login_password: "{{ mysqlRootPassword }}"
        login_unix_socket: "{{ mysqlRunDir | default('/var/run/mysqld') }}/mysqld.sock"

    - name: 安装 XtraBackup 依赖
      package:
        name:
          - percona-xtrabackup-24
          - gzip
          - mailutils
        state: present
      ignore_errors: yes

    - name: 生成 XtraBackup 备份脚本
      template:
        src: roles/mysql_deploy/templates/xtrabackup_backup.sh.j2
        dest: "/usr/local/bin/xtrabackup_backup.sh"
        owner: root
        group: root
        mode: '0755'

    - name: 添加 XtraBackup 定时任务（每天 4:00）
      cron:
        name: "MySQL XtraBackup backup"
        job: "/usr/local/bin/xtrabackup_backup.sh"
        minute: "0"
        hour: "4"
        user: root
        cron_file: mysql_xtrabackup_backup

    - name: 测试 XtraBackup 脚本
      command: "/usr/local/bin/xtrabackup_backup.sh --dry-run"
      register: xtrabackupTest
      changed_when: false
      ignore_errors: yes

    - name: 输出 XtraBackup 测试结果
      debug:
        msg: "XtraBackup 测试结果: {{ xtrabackupTest.stdout | default('执行失败，请检查 xtrabackup 是否安装') }}"

  handlers:
    - name: restart cron
      service:
        name: cron
        state: restarted
