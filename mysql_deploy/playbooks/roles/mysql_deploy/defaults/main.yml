---
# 部署方式: binary（二进制包）或 package（系统包管理器）
mysqlInstallMethod: "binary"

# MySQL 版本信息（二进制部署用）
mysqlVersion: "8.0.36"
mysqlBinaryPackage: "mysql-{{ mysqlVersion }}-linux-glibc2.12-x86_64.tar.xz"
mysqlDirName: "mysql-{{ mysqlVersion }}-linux-glibc2.12-x86_64"
mysqlBaseDir: "/usr/local/mysql"

# 目录
mysqlDataDir: "/var/lib/mysql"
mysqlLogDir: "/var/log/mysql"
mysqlRunDir: "/var/run/mysqld"
mysqlTmpDir: "/tmp"

# 端口与网络
mysqlPort: 3306
mysqlBindAddress: "0.0.0.0"

# 用户认证
mysqlRootPassword: "secure_root_password"
mysqlReplicationUser: "replicator"
mysqlReplicationPassword: "replication_password"
mysqlClusterName: "mysql_cluster"

# 性能
mysqlMaxConnections: 200
mysqlInnodbBufferPoolSize: "1G"
mysqlInnodbLogFileSize: "256M"

# 备份
backupDir: "/backup/mysql"
backupRetentionDays: 7
backupMysqldumpEnabled: true
backupXtrabackupEnabled: true
backupMysqldumpSchedule: "0 2 * * *"
backupXtrabackupSchedule: "0 4 * * *"

# 监控
monitoringEnabled: true
monitoringUser: "monitor"
monitoringPassword: "monitor_password"
