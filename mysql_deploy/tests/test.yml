---
- name: 测试 MySQL 二进制部署和备份
  hosts: localhost
  gather_facts: yes
  vars:
    mysqlBaseDir: "/usr/local/mysql"
    mysqlDataDir: "/var/lib/mysql"
    mysqlLogDir: "/var/log/mysql"
    mysqlRunDir: "/var/run/mysqld"
    mysqlRootPassword: "test_root_password"
    backupDir: "/tmp/test_backup"

  tasks:
    - name: 测试 1 - 检查 playbook 语法
      command: ansible-playbook --syntax-check playbooks/deploy_cluster.yml
      register: syntaxCheck
      failed_when: syntaxCheck.rc != 0

    - name: 测试 2 - 检查 mysqldump playbook 语法
      command: ansible-playbook --syntax-check playbooks/mysqldump_backup.yml
      register: syntaxCheckMysqldump
      failed_when: syntaxCheckMysqldump.rc != 0

    - name: 测试 3 - 检查 XtraBackup playbook 语法
      command: ansible-playbook --syntax-check playbooks/xtrabackup_backup.yml
      register: syntaxCheckXtrabackup
      failed_when: syntaxCheckXtrabackup.rc != 0

    - name: 测试 4 - 检查模板文件是否存在
      stat:
        path: "{{ item }}"
      loop:
        - playbooks/roles/mysql_deploy/templates/my.cnf.j2
        - playbooks/roles/mysql_deploy/templates/mysql.service.j2
        - playbooks/roles/mysql_deploy/templates/mysqldump_backup.sh.j2
        - playbooks/roles/mysql_deploy/templates/xtrabackup_backup.sh.j2
        - playbooks/roles/mysql_deploy/templates/cleanup_backups.sh.j2

    - name: 测试 5 - 检查 playbook 文件是否存在
      stat:
        path: "{{ item }}"
      loop:
        - playbooks/deploy_cluster.yml
        - playbooks/mysqldump_backup.yml
        - playbooks/xtrabackup_backup.yml

    - name: 测试 6 - 渲染 Jinja2 模板
      template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      vars:
        inventory_hostname: "test-server"
        mysqlVersion: "8.0.36"
        mysqlBaseDir: "{{ mysqlBaseDir }}"
        mysqlDataDir: "{{ mysqlDataDir }}"
        mysqlLogDir: "{{ mysqlLogDir }}"
        mysqlRunDir: "{{ mysqlRunDir }}"
        mysqlTmpDir: "/tmp"
        mysqlPort: 3306
        mysqlBindAddress: "0.0.0.0"
        mysqlInnodbBufferPoolSize: "1G"
        mysqlInnodbLogFileSize: "256M"
        mysqlMaxConnections: 200
        mysqlRootPassword: "{{ mysqlRootPassword }}"
        backupDir: "{{ backupDir }}"
        backupRetentionDays: 7
        mysqlReplicationUser: "replicator"
        mysqlReplicationPassword: "replication_password"
      loop:
        - { src: "../playbooks/roles/mysql_deploy/templates/my.cnf.j2", dest: "/tmp/test_my.cnf" }
        - { src: "../playbooks/roles/mysql_deploy/templates/mysql.service.j2", dest: "/tmp/test_mysql.service" }
        - { src: "../playbooks/roles/mysql_deploy/templates/mysqldump_backup.sh.j2", dest: "/tmp/test_mysqldump_backup.sh" }
        - { src: "../playbooks/roles/mysql_deploy/templates/xtrabackup_backup.sh.j2", dest: "/tmp/test_xtrabackup_backup.sh" }
        - { src: "../playbooks/roles/mysql_deploy/templates/cleanup_backups.sh.j2", dest: "/tmp/test_cleanup_backups.sh" }

    - name: 测试 7 - 检查生成的文件
      stat:
        path: "{{ item }}"
      loop:
        - /tmp/test_my.cnf
        - /tmp/test_mysql.service
        - /tmp/test_mysqldump_backup.sh
        - /tmp/test_xtrabackup_backup.sh
        - /tmp/test_cleanup_backups.sh

    - name: 测试 8 - 验证 Shell 脚本语法
      command: bash -n "{{ item }}"
      loop:
        - /tmp/test_mysqldump_backup.sh
        - /tmp/test_xtrabackup_backup.sh
        - /tmp/test_cleanup_backups.sh

    - name: 测试 9 - 验证 systemd unit 语法
      command: systemd-analyze verify /tmp/test_mysql.service
      register: systemdCheck
      failed_when: systemdCheck.rc != 0
      ignore_errors: yes

    - name: 测试 10 - 检查 my.cnf 的基本配置项
      command: grep -c "basedir" /tmp/test_my.cnf
      register: grepCheck
      failed_when: grepCheck.stdout | int < 1

    - name: 测试 11 - 输出测试结果
      debug:
        msg: "所有测试通过！MySQL 二进制部署模板验证成功。"

    - name: 测试 12 - 清理临时文件
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/test_my.cnf
        - /tmp/test_mysql.service
        - /tmp/test_mysqldump_backup.sh
        - /tmp/test_xtrabackup_backup.sh
        - /tmp/test_cleanup_backups.sh
        - "{{ backupDir }}"
